name: Leadgen Pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to run (1=NPI, 2=websites, 3=emails, all=full)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - 'all'
      only_orgs:
        description: 'Stage 2: organizations only (Recommended)'
        required: false
        default: true
        type: boolean
      limit:
        description: 'Stage 2: max providers per run (0 = all). Use 150-250 to stay under the 6h job limit.'
        required: false
        default: '200'
        type: string
  schedule:
    # Weekly Monday 4:00 UTC — refresh NPI data
    - cron: '0 4 * * 1'
    # Every hour — auto-resume website discovery until orgs done
    - cron: '15 * * * *'

# Prevent overlapping runs: only one pipeline run at a time. New scheduled
# runs wait in queue, so two runs can never write the same CSV concurrently.
concurrency:
  group: leadgen-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore previous outputs
        uses: actions/cache@v4
        with:
          path: outputs
          key: leadgen-outputs-v2-${{ github.run_id }}
          restore-keys: |
            leadgen-outputs-v2-
            leadgen-outputs-v1-

      - name: Run Stage 1 (NPI fetch)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == '1' || github.event.schedule == '0 4 * * 1' }}
        run: python npi_fetch.py

      - name: Run Stage 2 (Website discovery)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == '2' || github.event_name == 'schedule' }}
        run: |
          # --max-runtime 15500s keeps the job well under the 300-min hard limit so
          # the script exits cleanly and the cache-save step always runs (resume-safe).
          ARGS="--max-runtime 15500"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            ARGS="--limit ${{ github.event.inputs.limit }} $ARGS"
            if [ "${{ github.event.inputs.only_orgs }}" = "true" ]; then ARGS="--only-orgs $ARGS"; fi
          else
            # Unattended overnight sweep: process orgs as far as possible each run.
            ARGS="--only-orgs $ARGS"
          fi
          python find_websites.py $ARGS

      - name: Run Stage 3 (Email extraction)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == '3' || github.event_name == 'schedule' }}
        run: python find_emails.py

      - name: Verify outputs
        run: |
          ls -la outputs/
          wc -l outputs/*.csv 2>/dev/null || echo "no CSVs yet"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: leadgen-outputs
          path: outputs/
          if-no-files-found: warn
          retention-days: 30

      - name: Save outputs cache
        if: always()
        uses: actions/cache@v4
        with:
          path: outputs
          key: leadgen-outputs-v2-${{ github.run_id }}
